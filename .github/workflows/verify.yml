name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify public package
        run: python -X utf8 -B tools/verify.py
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run runtime regressions including Windows argv roundtrip
        run: python -X utf8 -B -m unittest discover -s tests
