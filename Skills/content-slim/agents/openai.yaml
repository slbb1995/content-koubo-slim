interface:
  display_name: "Content Slim 内容生产"
  short_description: "单一入口管理口播内容任务、版本状态与三次真人确认流程"
  default_prompt: >-
    使用 $content-slim 在同一个 Run 中开始或继续口播内容任务，并在每个真人确认点停下。收到方向、正文或配套决定后，先用入口返回的原 task-record 查询当前状态，再调用对应的 respond-*；不得猜测入口或改传绝对路径。Gate A 只把同版详细拆解报告确定性归并成五组客户内容：谁来说、讲给谁；核心观点和承诺；对标准备保留什么；哪些内容不照搬；准备怎么讲。客户确认后，Writer 必须使用同版详细拆解蓝图，不能只根据五组摘要写作。
