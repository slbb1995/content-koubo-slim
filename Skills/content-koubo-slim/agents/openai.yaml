interface:
  display_name: "Content 口播 Slim 内容生产"
  short_description: "管理口播正文及三平台配套的三次真人确认与版本保存"
  default_prompt: >-
    使用 $content-koubo-slim 开始或继续单篇或多篇口播内容任务，每篇使用独立 Run，并在方向、正文、三平台配套三个真人确认点停下。收到决定后，先用原 task-record 查询状态再调用对应 respond-*。保存后只改某个平台配套时保留正文确认与其他平台原文，使用明确 revision scope 生成新配套版本，不增加第四个确认点，不发布。
